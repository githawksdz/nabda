<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#fcf8fb" />
    <title>Nabda hors-ligne</title>
    <style>
      body {
        margin: 0;
        min-height: 100dvh;
        font-family: system-ui, sans-serif;
        background: #fcf8fb;
        color: #1c1b1d;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
      }
      main { max-width: 360px; }
      h1 { font-size: 1.4rem; margin: 0 0 8px; }
      p { color: #47464b; line-height: 1.45; }
      a {
        display: inline-flex;
        margin-top: 16px;
        background: #000;
        color: #fff;
        text-decoration: none;
        padding: 12px 16px;
        border-radius: 8px;
        font-weight: 600;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Nabda hors-ligne</h1>
      <p>
        Le réseau est indisponible. Ouvrez un contenu déjà téléchargé, ou
        reconnectez-vous pour mettre à jour.
      </p>
      <a href="/offline">Contenus téléchargés</a>
    </main>
  </body>
</html>
